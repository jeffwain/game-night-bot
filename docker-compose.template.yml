# Board Game Night Bot
# https://github.com/jeffwain/game-night-bot
#
# Quick start:
#   1. Create a file named .env next to this one containing:
#        DISCORD_TOKEN=your_token_here
#        TZ=America/Chicago
#   2. docker compose up -d
#   3. docker compose logs -f      <- prints an invite link if not in a server yet
#   4. Open http://<this-host>:8120/ from any machine on your LAN, or run
#      /admin config in Discord, to pick channels and a reminder time.
#
# To update:   docker compose pull && docker compose up -d

services:
  game-night-bot:
    # `:2` follows the latest 2.x release - fixes and features, never a
    # breaking change. Pin a full version (e.g. `:2.0.0`) to update by hand.
    image: ghcr.io/jeffwain/game-night-bot:2
    container_name: game-night-bot
    restart: unless-stopped

    # `:2` is a FLOATING tag -- it is re-pointed at each new 2.x release. Docker
    # does not re-check a tag it already has locally, so `docker compose up -d`
    # on its own will happily keep running a months-old image and report no
    # error at all. This makes `up` re-resolve the tag every time.
    #
    # Only affects explicit `up`; `restart: unless-stopped` still brings the
    # existing container back after a reboot without touching the network.
    pull_policy: always

    environment:
      - NODE_ENV=production

      # REQUIRED. Read from the .env file beside this compose file.
      # You can also skip .env entirely and put the token in data/.env instead.
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}

      # Optional. BoardGameGeek XML API token. Prefer putting it in data/.env
      # so it is not sitting next to compose. An empty value here is ignored.
      - BGG_APP_TOKEN=${BGG_APP_TOKEN:-}

      # Optional. Password for the BGG account that logs plays. Username is
      # set in the panel. Prefer data/.env. An empty value here is ignored.
      - BGG_PASSWORD=${BGG_PASSWORD:-}

      # Your timezone. Changeable later from Discord with /admin config.
      - TZ=${TZ:-America/Chicago}

      # Optional: background scan interval in ms (default 3600000 = 1 hour).
      #- CHECK_INTERVAL_MS=3600000

      # The web control panel and the public schedule page. Set WEB_PORT=0 to
      # turn both off; change the port here AND under `ports:` if 8120 clashes.
      #- WEB_PORT=8120

      # The panel answers only requests from private (LAN) addresses. Set this
      # to true ONLY if you have put your own authentication in front of it --
      # a VPN, or a reverse proxy that requires a login. It has no password of
      # its own, and it can rewrite the entire schedule.
      #- WEB_ALLOW_REMOTE=false

    ports:
      # Control panel:  http://<this-host>:8120/
      # Public page:    http://<this-host>:8120/public
      #
      # Bind to a single interface (e.g. "192.168.1.10:8120:8120") if this host
      # also faces the internet. To publish the read-only page to the world,
      # point a reverse proxy at /public -- never at /.
      - "8120:8120"

    volumes:
      # Persistent state: db.json plus rolling and daily backups. Keep this.
      - ./data:/app/data

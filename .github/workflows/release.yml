name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR
  id-token: write   # provenance attestation
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # release-doctor walks the tag history to explain a mismatch.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Three things have to name the same version before anything ships: the
      # tag, package.json, and package-lock.json. They are written in separate
      # places, so they can disagree, and a disagreement is silent until here.
      #
      # v2.2.1 is what this looks like when it goes wrong: the tag was pushed
      # onto a commit whose package.json still said 2.1.1, this step exited 1,
      # and nothing published. The version was then fixed in a later commit
      # that no tag pointed at, so the release never happened at all. The fix
      # is to move the tag, not to bump again -- hence the instructions below.
      - name: Refuse to publish if the tag, package.json and lockfile disagree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          LOCK="$(node -p "require('./package-lock.json').packages[''].version")"

          if [ "$TAG" = "$PKG" ] && [ "$PKG" = "$LOCK" ]; then
            echo "Tag, package.json and package-lock.json all agree on $PKG"
            exit 0
          fi

          {
            echo "### Release refused"
            echo
            echo "| where | version |"
            echo "| --- | --- |"
            echo "| tag | \`v$TAG\` |"
            echo "| package.json | \`$PKG\` |"
            echo "| package-lock.json | \`$LOCK\` |"
            echo
            if [ "$PKG" != "$LOCK" ]; then
              echo "package.json and the lockfile disagree, which also breaks \`npm ci\`."
              echo "Run \`npm install --package-lock-only\` and commit the lockfile."
            else
              echo "The tag names a version this commit does not carry, so it can never publish."
              echo "Nothing was released. Move the tag onto the commit that does:"
              echo
              echo '```'
              echo "git tag -d v$TAG && git push origin :refs/tags/v$TAG"
              echo "git tag -a v$TAG <commit-with-$TAG> -m \"v$TAG\""
              echo "git push origin v$TAG"
              echo '```'
            fi
            echo
            echo "\`npm run release:doctor\` prints the same thing locally, with the commit filled in."
            echo "Releasing with \`npm version <patch|minor|major>\` keeps all three in step automatically."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Tag v$TAG, package.json $PKG, package-lock $LOCK -- see the job summary for how to fix it"
          exit 1

      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # workflow_dispatch runs on a branch, so every semver rule above
            # matches nothing and buildx dies with "tag is needed when pushing
            # to registry". These keep a manual run publishable while never
            # touching the :2 and :latest floats docker-compose.yml follows.
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=Board Game Night Bot
            org.opencontainers.image.description=Discord bot that runs a hosting rotation for a recurring board game night.
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            --verify-tag \
            --title "${GITHUB_REF#refs/tags/}"
